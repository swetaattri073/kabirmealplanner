<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#6b8f3c" />
  <title>LittleBowl</title>
  <style>
    :root { --bg: #fffaf0; --green: #6b8f3c; --ink: #2c3a1f; --muted: #6b7a5a; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 120% 80% at 50% -10%, #eef5dc 0%, transparent 55%),
        linear-gradient(180deg, #fffaf0 0%, #f5efe0 100%);
      color: var(--ink);
      overscroll-behavior: none;
    }
    main {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
    }
    .mark {
      width: 96px; height: 96px; margin: 0 auto 1.1rem; border-radius: 24px;
      background: linear-gradient(145deg, #6b8f3c, #8fb85a);
      box-shadow: 0 14px 32px rgba(107, 143, 60, 0.3);
      position: relative;
    }
    .mark::after {
      content: "";
      position: absolute; inset: 28% 22% 22%;
      border: 3px solid rgba(255, 250, 240, 0.95);
      border-radius: 0 0 48% 48%; border-top: none;
    }
    h1 { margin: 0 0 0.4rem; font-size: 1.9rem; letter-spacing: -0.02em; text-align: center; }
    h1 .little { color: var(--green); }
    h1 .bowl { color: #f97316; }
    p { margin: 0; color: var(--muted); text-align: center; font-weight: 600; line-height: 1.45; }
    .spinner {
      width: 28px; height: 28px; margin: 1.35rem auto 0;
      border: 3px solid rgba(107, 143, 60, 0.2); border-top-color: var(--green);
      border-radius: 50%; animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="./config.js"></script>
</head>
<body>
  <main>
    <div>
      <div class="mark" aria-hidden="true"></div>
      <h1><span class="little">Little</span><span class="bowl">Bowl</span></h1>
      <p>Little meals, big growth</p>
      <div class="spinner" aria-label="Loading"></div>
    </div>
  </main>
  <script>
    (function () {
      var url = (window.LITTLEBOWL_DEFAULT_SERVER || 'https://littlebowl.in/home').replace(/\/+$/, '');
      if (new URLSearchParams(window.location.search).has('stay')) return;
      setTimeout(function () { window.location.replace(url); }, 350);
    })();
  </script>
</body>
</html>
